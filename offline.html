<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f9df7">
  <title>Biblo - Sem conexão</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#e9ecef;color:#333;text-align:center}
    main{padding:2rem}
    img{width:96px;height:96px;border-radius:20px}
    button{margin-top:1rem;padding:.6rem 1.4rem;border:0;border-radius:6px;background:#0f9df7;color:#fff;font-size:1rem}
  </style>
</head>
<body>
  <main>
    <img src="pwa/icon-192.png" alt="Biblo">
    <h1>Você está sem conexão</h1>
    <p>O Biblo precisa de internet para acessar a biblioteca. Verifique sua conexão e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
